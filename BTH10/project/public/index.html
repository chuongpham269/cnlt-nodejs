<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ứng Dụng Chat Realtime</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Màn hình nhập Tên -->
    <div id="login-container">
        <h2 id="form-title">Đăng Nhập</h2>
        <input type="text" id="username-input" placeholder="Tên đăng nhập...">
        <input type="password" id="password-input" placeholder="Mật khẩu...">
        <button id="join-btn">Đăng Nhập</button>
        <p style="margin-top: 15px; font-size: 0.9em; color: #0d6efd; cursor: pointer; text-decoration: underline;"
            id="toggle-form-btn">Chưa có tài khoản? Đăng ký ngay</p>
    </div>

    <!-- Màn hình Chat chính (Ban đầu ẩn) -->
    <div id="chat-container" class="hidden">
        <!-- Cột danh sách Online -->
        <div class="sidebar">
            <h3>Danh Sách User</h3>
            <ul id="user-list"></ul>
        </div>

        <!-- Cột Chat -->
        <div class="main-chat">
            <div class="chat-header">
                <h3 id="chat-with-title">Chat Chung</h3>
                <div>
                    <span id="current-user-display"></span>
                    <button id="logout-btn"
                        style="margin-left: 10px; padding: 5px 10px; background: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; display: none;">Đăng
                        Xuất</button>
                </div>
            </div>
            <div id="messages"></div>
            
            <!-- Sticker/Emoji Menu -->
            <div id="emoji-menu" class="hidden">
                <span class="emoji" onclick="sendEmoji('😀')">😀</span>
                <span class="emoji" onclick="sendEmoji('😂')">😂</span>
                <span class="emoji" onclick="sendEmoji('🥰')">🥰</span>
                <span class="emoji" onclick="sendEmoji('😎')">😎</span>
                <span class="emoji" onclick="sendEmoji('😭')">😭</span>
                <span class="emoji" onclick="sendEmoji('😡')">😡</span>
                <span class="emoji" onclick="sendEmoji('👍')">👍</span>
                <span class="emoji" onclick="sendEmoji('👎')">👎</span>
                <span class="emoji" onclick="sendEmoji('❤️')">❤️</span>
                <span class="emoji" onclick="sendEmoji('🎉')">🎉</span>
                <span class="emoji" onclick="sendEmoji('🔥')">🔥</span>
                <span class="emoji" onclick="sendEmoji('💯')">💯</span>
            </div>

            <div class="chat-input">
                <button id="emoji-btn" title="Gửi Emoji">😀</button>
                <button id="attach-btn" title="Đính kèm File/Ảnh">📎</button>
                <input type="file" id="file-input" hidden>
                <input type="text" id="message-input" placeholder="Nhập tin nhắn...">
                <button id="send-btn">Gửi</button>
            </div>
        </div>
    </div>

    <!-- Khai báo thư viện Socket client từ server Nodejs -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="main.js"></script>
</body>

</html>
